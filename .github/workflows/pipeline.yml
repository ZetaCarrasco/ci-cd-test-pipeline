name: QA Pipeline

on:
  workflow_dispatch:
  push:
    branches: [main]

jobs:
  api-tests:
    runs-on: ubuntu-24.04
    timeout-minutes: 10

    steps:
      - name: Checkout api-testing-automation
        uses: actions/checkout@v6
        with:
          repository: ZetaCarrasco/api-testing-automation
          path: api-testing-automation

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'

      - name: Install dependencies
        working-directory: api-testing-automation
        run: pip install -r requirements.txt

      - name: Run API tests
        working-directory: api-testing-automation
        run: pytest tests/ -v

  e2e-tests:
    runs-on: ubuntu-24.04
    timeout-minutes: 20

    steps:
      - name: Checkout web-e2e-playwright
        uses: actions/checkout@v6
        with:
          repository: ZetaCarrasco/web-e2e-playwright
          path: web-e2e-playwright

      - name: Set up Node
        uses: actions/setup-node@v6
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: web-e2e-playwright/package-lock.json

      - name: Install test suite dependencies
        working-directory: web-e2e-playwright
        run: npm ci

      - name: Install backend dependencies
        working-directory: web-e2e-playwright
        run: npm ci --prefix app/backend

      - name: Install Playwright browser
        working-directory: web-e2e-playwright
        run: npx playwright install --with-deps chromium

      - name: Run Playwright tests (Chromium)
        working-directory: web-e2e-playwright
        run: npx playwright test --project=chromium

      - name: Upload HTML report
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: playwright-report
          path: web-e2e-playwright/playwright-report/
          retention-days: 14
